<!doctype html><html><body style="margin:0;background:#000"><canvas id="c" width="1080" height="1920"></canvas>
<script>
const W=1080,H=1920;
function rand(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const GOLD=['#b8913f','#d6ae5a','#f6dc94','#f3d58c','#d6ae5a','#b38a3a'];
function gg(x,x0,y0,x1,y1,st=GOLD){const g=x.createLinearGradient(x0,y0,x1,y1);st.forEach((c,i)=>g.addColorStop(i/(st.length-1),c));return g}
function glowDot(x,cx,cy,r,col,a){const g=x.createRadialGradient(cx,cy,0,cx,cy,r);g.addColorStop(0,col.replace('A',a));g.addColorStop(.35,col.replace('A',a*.45));g.addColorStop(1,col.replace('A',0));x.fillStyle=g;x.fillRect(cx-r,cy-r,2*r,2*r)}
function star4(x,cx,cy,z,col,a=1){x.save();x.globalAlpha=a;x.fillStyle=col;x.beginPath();x.moveTo(cx,cy-z*2.6);x.quadraticCurveTo(cx+z*.25,cy-z*.25,cx+z*2.6,cy);x.quadraticCurveTo(cx+z*.25,cy+z*.25,cx,cy+z*2.6);x.quadraticCurveTo(cx-z*.25,cy+z*.25,cx-z*2.6,cy);x.quadraticCurveTo(cx-z*.25,cy-z*.25,cx,cy-z*2.6);x.fill();x.restore()}
let CLEAR=null;function inClear(px,py){return CLEAR&&px>CLEAR[0]&&px<CLEAR[2]&&py>CLEAR[1]&&py<CLEAR[3]}
function sparkleField(x,r,n,cols,area){for(let i=0;i<n;i++){const px=area?area.x+r()*area.w:r()*W,py=area?area.y+r()*area.h:r()*H;let z=r();const c=cols[Math.floor(r()*cols.length)];if(inClear(px,py)){if(r()>.25)continue;z=Math.min(z,.5)}
  if(z>.93){glowDot(x,px,py,26+z*30,c,.35);star4(x,px,py,2.2+z*3,'#fffaf0',.95)}else{x.fillStyle=c.replace('A',.25+z*.6);x.beginPath();x.arc(px,py,.6+z*2,0,7);x.fill()}}}
function bokeh(x,r,n,cols,area){x.save();x.globalCompositeOperation='screen';for(let i=0;i<n;i++){const px=area.x+r()*area.w,py=area.y+r()*area.h,rr=14+r()*60,c=cols[Math.floor(r()*cols.length)];const g=x.createRadialGradient(px,py,rr*.2,px,py,rr);g.addColorStop(0,c.replace('A',.10+r()*.12));g.addColorStop(.85,c.replace('A',.07));g.addColorStop(1,c.replace('A',0));x.fillStyle=g;x.beginPath();x.arc(px,py,rr,0,7);x.fill()}x.restore()}
function blurLayer(draw,b){const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');draw(x);const o=document.createElement('canvas');o.width=W;o.height=H;const y=o.getContext('2d');y.filter='blur('+b+'px)';y.drawImage(c,0,0);return o}
function frame(x,inset){x.save();x.strokeStyle=gg(x,0,0,W,H);x.lineWidth=2.6;x.strokeRect(inset,inset,W-2*inset,H-2*inset);x.lineWidth=1;x.globalAlpha=.6;x.strokeRect(inset+12,inset+12,W-2*inset-24,H-2*inset-24);x.restore()}
function filigreeCorner(x,cx,cy,sx,sy,s=1){x.save();x.translate(cx,cy);x.scale(sx*s,sy*s);x.strokeStyle=gg(x,0,0,160,160);x.lineWidth=2;x.lineCap='round';
  x.beginPath();x.moveTo(0,150);x.bezierCurveTo(0,60,60,0,150,0);x.stroke();
  x.lineWidth=1.4;x.beginPath();x.moveTo(18,120);x.bezierCurveTo(20,70,50,30,95,22);x.bezierCurveTo(70,40,62,62,70,80);x.bezierCurveTo(78,62,96,58,110,66);x.stroke();
  x.beginPath();x.moveTo(120,18);x.bezierCurveTo(70,20,30,50,22,95);x.stroke();
  [[40,40,4],[150,0,3],[0,150,3],[70,80,2.5]].forEach(([a,b,r])=>{x.fillStyle=gg(x,a-5,b-5,a+5,b+5);x.beginPath();x.arc(a,b,r,0,7);x.fill()});
  x.restore()}

/* ---------- mariposa ---------- */
function butterfly(x,cx,cy,sz,rot,open,pal,a=1){x.save();x.translate(cx,cy);x.rotate(rot);x.globalAlpha=a;
  const wing=(side)=>{x.save();x.scale(side*open,1);
    const up=()=>{x.beginPath();x.moveTo(0,-sz*.02);x.bezierCurveTo(sz*.2,-sz*.55,sz*.7,-sz*.98,sz*1.12,-sz*.92);x.bezierCurveTo(sz*1.2,-sz*.6,sz*1.02,-sz*.25,sz*.82,-sz*.08);x.bezierCurveTo(sz*.5,sz*.02,sz*.2,sz*.02,0,0);x.closePath()};
    const lo=()=>{x.beginPath();x.moveTo(0,sz*.02);x.bezierCurveTo(sz*.35,sz*.0,sz*.78,sz*.1,sz*.74,sz*.42);x.bezierCurveTo(sz*.7,sz*.66,sz*.45,sz*.7,sz*.36,sz*.66);x.quadraticCurveTo(sz*.3,sz*.92,sz*.2,sz*1.0);x.quadraticCurveTo(sz*.2,sz*.7,sz*.08,sz*.45);x.quadraticCurveTo(sz*.02,sz*.25,0,sz*.1);x.closePath()};
    [[lo,pal.lo,[sz*.1,sz*.12,sz*.02,sz*.4,sz*.4,sz*.65]],[up,pal.up,[sz*.12,-sz*.1,sz*.04,sz*.6,-sz*.5,sz*1.05]]].forEach(([shape,cols,gp])=>{
      shape();const g=x.createRadialGradient(...gp);cols.forEach((c,i)=>g.addColorStop(i/(cols.length-1),c));x.fillStyle=g;x.shadowColor=pal.glow;x.shadowBlur=sz*.45;x.fill();x.shadowBlur=0;
      x.save();shape();x.clip();x.strokeStyle=pal.band;x.lineWidth=sz*.16;shape();x.stroke();
      x.fillStyle='rgba(255,250,235,.9)';for(let i=0;i<7;i++){const t=i/6;const px=shape===up?sz*(.75+.38*t):sz*(.72-.3*t),py=shape===up?-sz*(.9-.75*t):sz*(.3+.38*t);x.beginPath();x.arc(px,py,Math.max(1,sz*.03),0,7);x.fill()}
      x.globalAlpha*=.5;x.strokeStyle=pal.edge;x.lineWidth=Math.max(.6,sz*.012);x.beginPath();if(shape===up){x.moveTo(sz*.04,-sz*.03);x.quadraticCurveTo(sz*.5,-sz*.45,sz*1.05,-sz*.82);x.moveTo(sz*.05,-sz*.02);x.quadraticCurveTo(sz*.6,-sz*.3,sz*1.0,-sz*.45);x.moveTo(sz*.05,-sz*.01);x.quadraticCurveTo(sz*.5,-sz*.1,sz*.85,-sz*.15)}else{x.moveTo(sz*.04,sz*.05);x.quadraticCurveTo(sz*.4,sz*.15,sz*.65,sz*.45);x.moveTo(sz*.04,sz*.06);x.quadraticCurveTo(sz*.25,sz*.4,sz*.3,sz*.7)}x.stroke();x.restore();
      shape();x.strokeStyle=pal.edge;x.lineWidth=Math.max(1,sz*.025);x.stroke()});
    // ojo dorado en el ala
    x.fillStyle='rgba(255,246,220,.8)';x.beginPath();x.arc(sz*.62,-sz*.45,sz*.07,0,7);x.fill();x.strokeStyle=pal.edge;x.lineWidth=Math.max(.8,sz*.015);x.beginPath();x.arc(sz*.62,-sz*.45,sz*.11,0,7);x.stroke();
    x.restore()};
  wing(-1);wing(1);
  x.fillStyle=gg(x,0,-sz*.3,0,sz*.4,['#6b4a1c','#f6dc94','#8a6424']);x.beginPath();x.ellipse(0,sz*.05,sz*.05,sz*.38,0,0,7);x.fill();
  x.strokeStyle=pal.edge;x.lineWidth=Math.max(.8,sz*.015);x.beginPath();x.moveTo(0,-sz*.3);x.quadraticCurveTo(-sz*.1,-sz*.55,-sz*.22,-sz*.6);x.moveTo(0,-sz*.3);x.quadraticCurveTo(sz*.1,-sz*.55,sz*.22,-sz*.6);x.stroke();
  x.restore()}

/* ===== 1 · Mariposas de luz (violeta noche) ===== */
function sceneMariposas(x){const r=rand(31);
  let g=x.createRadialGradient(W/2,H*.5,80,W/2,H*.5,H*.8);g.addColorStop(0,'#3a1d66');g.addColorStop(.55,'#1d0d3c');g.addColorStop(1,'#08041a');x.fillStyle=g;x.fillRect(0,0,W,H);
  // aurora holográfica
  x.drawImage(blurLayer(y=>{y.globalCompositeOperation='screen';[['rgba(150,110,255,.40)',W*.15,H*.18,520],['rgba(90,210,230,.22)',W*.85,H*.12,460],['rgba(246,200,140,.22)',W*.8,H*.86,520],['rgba(220,120,220,.26)',W*.12,H*.82,520],['rgba(120,90,230,.25)',W*.5,H*.5,640]].forEach(([c,px,py,rr])=>{const q=y.createRadialGradient(px,py,0,px,py,rr);q.addColorStop(0,c);q.addColorStop(1,c.replace(/[\d.]+\)$/,'0)'));y.fillStyle=q;y.fillRect(0,0,W,H)})},40),0,0);
  // bandas de luz diagonales
  x.drawImage(blurLayer(y=>{y.globalCompositeOperation='screen';y.translate(W/2,H/2);y.rotate(-.5);for(let i=0;i<5;i++){y.fillStyle=`rgba(${[200,170,255][0]},${180+i*10},255,${.05+i*.012})`;y.fillRect(-W,-H*.2+i*90-260,W*2,30+i*8)}},30),0,0);
  bokeh(x,r,50,['rgba(210,180,255,A)','rgba(246,220,148,A)','rgba(150,230,240,A)'],{x:0,y:0,w:W,h:H});
  sparkleField(x,r,420,['rgba(246,220,148,A)','rgba(230,215,255,A)','rgba(255,255,255,A)']);
  const P1={up:['rgba(255,247,220,.95)','rgba(246,220,148,.92)','rgba(214,174,90,.88)','rgba(170,120,230,.78)'],lo:['rgba(255,240,210,.9)','rgba(230,190,120,.85)','rgba(150,110,230,.75)'],edge:'rgba(255,236,180,.95)',band:'rgba(150,100,40,.45)',glow:'rgba(246,210,140,.9)'};
  const P2={up:['rgba(255,255,255,.9)','rgba(215,190,255,.85)','rgba(160,120,240,.8)','rgba(110,200,230,.7)'],lo:['rgba(250,240,255,.85)','rgba(190,160,250,.8)','rgba(120,190,230,.7)'],edge:'rgba(240,225,255,.95)',band:'rgba(70,40,150,.45)',glow:'rgba(190,160,255,.9)'};
  // senderos de luz
  const trail=(pts)=>{x.save();x.globalCompositeOperation='screen';for(let k=0;k<3;k++){x.strokeStyle=`rgba(246,220,148,${.10+k*.07})`;x.lineWidth=10-k*4;x.filter='blur('+(6-k*2.5)+'px)';x.beginPath();x.moveTo(...pts[0]);x.bezierCurveTo(...pts[1],...pts[2],...pts[3]);x.stroke()}x.filter='none';x.restore();
    for(let t=0;t<1;t+=.025){const u=1-t;const px=u*u*u*pts[0][0]+3*u*u*t*pts[1][0]+3*u*t*t*pts[2][0]+t*t*t*pts[3][0];const py=u*u*u*pts[0][1]+3*u*u*t*pts[1][1]+3*u*t*t*pts[2][1]+t*t*t*pts[3][1];x.fillStyle=`rgba(255,240,200,${.3+r()*.6})`;x.beginPath();x.arc(px+(r()-.5)*24,py+(r()-.5)*24,.8+r()*2.4,0,7);x.fill()}};
  trail([[-40,H*.98],[W*.2,H*.88],[W*.05,H*.74],[W*.3,H*.70]]);
  trail([[W+40,H*.02],[W*.8,H*.12],[W*.98,H*.24],[W*.72,H*.28]]);
  // racimo inferior izquierdo
  [[150,1690,120,-.35,P1],[330,1785,70,.2,P2],[95,1520,58,-.6,P2],[280,1600,46,.4,P1],[460,1720,36,-.2,P1],[60,1820,40,.1,P1],[230,1440,30,-.3,P1],[560,1820,26,.3,P2],[960,1790,60,.4,P2],[880,1700,34,-.3,P1],[1010,1640,26,.2,P1]].forEach(([a,b,s,rt,p],i)=>butterfly(x,a,b,s,rt,.82+r()*.18,p,.95));
  // racimo superior derecho
  [[920,250,108,.45,P1],[760,150,62,-.2,P2],[1000,430,52,.6,P2],[830,350,38,.1,P1],[640,100,30,-.4,P1],[110,230,48,-.4,P2],[200,120,30,.3,P1],[60,380,26,-.2,P1]].forEach(([a,b,s,rt,p])=>butterfly(x,a,b,s,rt,.82+r()*.18,p,.95));
  // halo central suave para el texto
  g=x.createRadialGradient(W/2,H*.5,0,W/2,H*.5,W*.62);g.addColorStop(0,'rgba(20,8,45,.45)');g.addColorStop(1,'rgba(20,8,45,0)');x.fillStyle=g;x.fillRect(0,0,W,H);
  frame(x,34);[[34,34,1,1],[W-34,34,-1,1],[34,H-34,1,-1],[W-34,H-34,-1,-1]].forEach(([a,b,sx,sy])=>filigreeCorner(x,a+10*sx,b+10*sy,sx,sy,.9));
}

/* ===== 2 · Tiara de cristal (rosa empolvado y champagne) ===== */
function gem(x,cx,cy,rr,col){const g=x.createRadialGradient(cx-rr*.3,cy-rr*.3,rr*.1,cx,cy,rr);g.addColorStop(0,'#ffffff');g.addColorStop(.35,col[0]);g.addColorStop(1,col[1]);x.fillStyle=g;x.beginPath();x.moveTo(cx,cy-rr);x.lineTo(cx+rr*.8,cy-rr*.2);x.lineTo(cx+rr*.5,cy+rr*.85);x.lineTo(cx-rr*.5,cy+rr*.85);x.lineTo(cx-rr*.8,cy-rr*.2);x.closePath();x.fill();x.strokeStyle='rgba(255,255,255,.75)';x.lineWidth=1;x.beginPath();x.moveTo(cx,cy-rr);x.lineTo(cx,cy+rr*.85);x.moveTo(cx-rr*.8,cy-rr*.2);x.lineTo(cx+rr*.8,cy-rr*.2);x.stroke();x.strokeStyle=gg(x,cx-rr,cy,cx+rr,cy);x.lineWidth=2;x.beginPath();x.moveTo(cx,cy-rr);x.lineTo(cx+rr*.8,cy-rr*.2);x.lineTo(cx+rr*.5,cy+rr*.85);x.lineTo(cx-rr*.5,cy+rr*.85);x.lineTo(cx-rr*.8,cy-rr*.2);x.closePath();x.stroke()}
function tiara(x,cx,cy,w){const r=rand(7);
  // rayos
  x.save();x.globalCompositeOperation='screen';for(let i=0;i<26;i++){const a=-Math.PI/2+(i-12.5)*.11;x.fillStyle=`rgba(255,236,200,${.05+r()*.06})`;x.beginPath();x.moveTo(cx,cy+20);x.lineTo(cx+Math.cos(a-.025)*900,cy+20+Math.sin(a-.025)*900);x.lineTo(cx+Math.cos(a+.025)*900,cy+20+Math.sin(a+.025)*900);x.fill()}x.restore();
  glowDot(x,cx,cy-20,420,'rgba(255,240,215,A)',.75);
  const base=(t)=>cy+90-Math.sin(t*Math.PI)*60; // banda en arco
  const X=t=>cx-w/2+w*t;
  // banda
  x.save();x.lineCap='round';x.shadowColor='rgba(120,70,40,.35)';x.shadowBlur=14;x.strokeStyle=gg(x,cx-w/2,0,cx+w/2,0,['#9b7a34','#f6dc94','#c9a24e','#fff1c4','#b8913f']);x.lineWidth=16;x.beginPath();for(let t=0;t<=1.001;t+=.02){const px=X(t),py=base(t);t?x.lineTo(px,py):x.moveTo(px,py)}x.stroke();x.shadowBlur=0;
  x.lineWidth=4;x.strokeStyle='rgba(255,250,235,.8)';x.beginPath();for(let t=.02;t<=.981;t+=.02){const px=X(t),py=base(t)-3;t>.02?x.lineTo(px,py):x.moveTo(px,py)}x.stroke();
  // puntas
  const spires=[[.08,.18],[.2,.32],[.34,.5],[.5,.78],[.66,.5],[.8,.32],[.92,.18]];
  spires.forEach(([t,h])=>{const bx=X(t),by=base(t)-6,hh=h*w*.42,sw=w*.075;
    x.strokeStyle=gg(x,bx-sw,by-hh,bx+sw,by);x.lineWidth=5;x.beginPath();x.moveTo(bx-sw,by);x.bezierCurveTo(bx-sw*.9,by-hh*.45,bx-sw*.15,by-hh*.7,bx,by-hh);x.bezierCurveTo(bx+sw*.15,by-hh*.7,bx+sw*.9,by-hh*.45,bx+sw,by);x.stroke();
    x.lineWidth=2.4;x.beginPath();x.moveTo(bx-sw*.55,by);x.quadraticCurveTo(bx,by-hh*.55,bx+sw*.55,by);x.stroke();
    gem(x,bx,by-hh*.42,sw*.42,['#f5e6ff','#b9a6d8']);gem(x,bx,by-hh-sw*.32,sw*(h>.6?.42:.3),['#fff3f6','#e6b6c4']);
    glowDot(x,bx,by-hh-sw*.32,sw*1.6,'rgba(255,255,255,A)',.55);star4(x,bx+sw*.1,by-hh-sw*.4,sw*.12,'#fff',1)});
  // perlas en la banda
  for(let t=.03;t<=.97;t+=.04){const px=X(t),py=base(t)+14;const g=x.createRadialGradient(px-2,py-2,1,px,py,7);g.addColorStop(0,'#fff');g.addColorStop(1,'#d8c3b0');x.fillStyle=g;x.beginPath();x.arc(px,py,6.5,0,7);x.fill()}
  // destellos
  for(let i=0;i<34;i++){const px=cx+(r()-.5)*w*1.2,py=cy-w*.4+r()*w*.55;star4(x,px,py,1.5+r()*4,'#fffdf5',.5+r()*.5)}
  x.restore()}
function sceneTiara(x){const r=rand(77);
  let g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#f6e3dc');g.addColorStop(.5,'#ecc9c0');g.addColorStop(1,'#dcb0a8');x.fillStyle=g;x.fillRect(0,0,W,H);
  // pliegues de satén
  x.drawImage(blurLayer(y=>{for(let i=0;i<9;i++){const yy=-300+i*330+r()*80;const q=y.createLinearGradient(0,yy,0,yy+200);q.addColorStop(0,'rgba(255,255,255,0)');q.addColorStop(.5,`rgba(255,250,245,${.28+r()*.2})`);q.addColorStop(1,'rgba(255,255,255,0)');y.save();y.translate(W/2,yy);y.rotate(-.42+r()*.12);y.fillStyle=q;y.fillRect(-W*1.5,-100,W*3,200);y.restore();
    y.save();y.translate(W/2,yy+170);y.rotate(-.42);y.fillStyle=`rgba(150,80,80,${.06+r()*.05})`;y.fillRect(-W*1.5,-40,W*3,80);y.restore()}},28),0,0);
  bokeh(x,r,40,['rgba(255,255,255,A)','rgba(255,225,200,A)','rgba(246,220,148,A)'],{x:0,y:0,w:W,h:H});
  // polvo dorado
  sparkleField(x,r,360,['rgba(214,174,90,A)','rgba(184,145,63,A)','rgba(255,255,255,A)']);
  tiara(x,W/2,330,640);
  // viñeta suave
  g=x.createRadialGradient(W/2,H*.55,H*.3,W/2,H*.55,H*.8);g.addColorStop(0,'rgba(120,60,60,0)');g.addColorStop(1,'rgba(120,60,60,.22)');x.fillStyle=g;x.fillRect(0,0,W,H);
  // velo claro donde va el texto
  g=x.createRadialGradient(W/2,H*.66,0,W/2,H*.66,W*.65);g.addColorStop(0,'rgba(255,246,240,.45)');g.addColorStop(1,'rgba(255,246,240,0)');x.fillStyle=g;x.fillRect(0,0,W,H);
  frame(x,34);[[34,34,1,1],[W-34,34,-1,1],[34,H-34,1,-1],[W-34,H-34,-1,-1]].forEach(([a,b,sx,sy])=>filigreeCorner(x,a+10*sx,b+10*sy,sx,sy,.9));
}

/* ===== 3 · Araña de cristal (negro y dorado) ===== */
function crystal(x,cx,cy,s){const g=x.createLinearGradient(cx-s,cy-s*1.6,cx+s,cy+s*1.6);g.addColorStop(0,'rgba(255,255,255,.95)');g.addColorStop(.4,'rgba(246,220,148,.75)');g.addColorStop(.7,'rgba(180,210,255,.65)');g.addColorStop(1,'rgba(255,255,255,.9)');x.fillStyle=g;x.beginPath();x.moveTo(cx,cy-s*1.7);x.lineTo(cx+s,cy);x.lineTo(cx,cy+s*1.7);x.lineTo(cx-s,cy);x.closePath();x.fill();x.strokeStyle='rgba(255,255,255,.7)';x.lineWidth=.8;x.beginPath();x.moveTo(cx,cy-s*1.7);x.lineTo(cx,cy+s*1.7);x.stroke()}
function chandelier(x,cx,top){const r=rand(5);
  glowDot(x,cx,top+300,560,'rgba(255,214,140,A)',.45);glowDot(x,cx,top+300,240,'rgba(255,236,190,A)',.6);
  // cadena
  x.strokeStyle=gg(x,cx-4,0,cx+4,top+120);x.lineWidth=3;for(let y=-10;y<top+110;y+=16){x.beginPath();x.ellipse(cx,y,4,7,0,0,7);x.stroke()}
  const tiers=[{y:top+170,rx:150,n:9,len:150},{y:top+300,rx:280,n:13,len:200},{y:top+420,rx:380,n:17,len:230}];
  // copa central
  x.fillStyle=gg(x,cx-40,top+110,cx+40,top+260,['#8a6424','#f6dc94','#b8913f']);x.beginPath();x.moveTo(cx-34,top+110);x.quadraticCurveTo(cx-70,top+210,cx,top+260);x.quadraticCurveTo(cx+70,top+210,cx+34,top+110);x.closePath();x.fill();
  tiers.forEach((t,ti)=>{
    // brazo en elipse (anillo)
    x.save();x.strokeStyle=gg(x,cx-t.rx,t.y,cx+t.rx,t.y,['#9b7a34','#f6dc94','#c9a24e','#fff1c4','#b8913f']);x.lineWidth=5-ti;x.shadowColor='rgba(255,210,130,.6)';x.shadowBlur=14;x.beginPath();x.ellipse(cx,t.y,t.rx,t.rx*.16,0,0,7);x.stroke();x.restore();
    // guirnaldas de cristales colgando entre puntos
    for(let i=0;i<t.n;i++){const a=i/t.n*Math.PI*2;const px=cx+Math.cos(a)*t.rx,py=t.y+Math.sin(a)*t.rx*.16;const front=Math.sin(a)>-.2;
      const L=t.len*(.7+r()*.3);x.strokeStyle=front?'rgba(255,240,200,.55)':'rgba(255,240,200,.25)';x.lineWidth=1;x.beginPath();x.moveTo(px,py);x.lineTo(px,py+L);x.stroke();
      for(let k=10;k<L;k+=16){x.fillStyle=`rgba(255,250,235,${front?.8:.4})`;x.beginPath();x.arc(px,py+k,2.4,0,7);x.fill()}
      crystal(x,px,py+L+14,front?9:6);if(front&&r()>.4){glowDot(x,px,py+L+14,30,'rgba(255,255,255,A)',.5);star4(x,px+2,py+L+10,2.4,'#fff',1)}
      // velas
      if(i%2===0&&front){x.fillStyle='#f8efe0';x.fillRect(px-5,py-40,10,38);glowDot(x,px,py-52,46,'rgba(255,200,110,A)',.8);x.fillStyle='#fff6d8';x.beginPath();x.ellipse(px,py-50,4,9,0,0,7);x.fill()}
    }
    // guirnalda en festón
    x.strokeStyle='rgba(255,245,220,.6)';x.lineWidth=1.2;for(let i=0;i<t.n;i++){const a1=i/t.n*Math.PI*2,a2=(i+1)/t.n*Math.PI*2;const p1=[cx+Math.cos(a1)*t.rx,t.y+Math.sin(a1)*t.rx*.16],p2=[cx+Math.cos(a2)*t.rx,t.y+Math.sin(a2)*t.rx*.16];if(Math.sin((a1+a2)/2)<-.2)continue;x.beginPath();x.moveTo(...p1);x.quadraticCurveTo((p1[0]+p2[0])/2,(p1[1]+p2[1])/2+46,...p2);x.stroke();for(let u=.1;u<1;u+=.12){const qx=(1-u)*(1-u)*p1[0]+2*(1-u)*u*(p1[0]+p2[0])/2+u*u*p2[0],qy=(1-u)*(1-u)*p1[1]+2*(1-u)*u*((p1[1]+p2[1])/2+46)+u*u*p2[1];x.fillStyle='rgba(255,252,240,.85)';x.beginPath();x.arc(qx,qy,2.2,0,7);x.fill()}}
  });
  // gota final
  crystal(x,cx,top+560,22);glowDot(x,cx,top+560,90,'rgba(255,255,255,A)',.5);star4(x,cx+4,top+548,5,'#fff',1);
}
function sceneArana(x){const r=rand(19);

function sceneLuna(x){const r=rand(91);
  let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#050b24');g.addColorStop(.5,'#0b1640');g.addColorStop(1,'#04122a');x.fillStyle=g;x.fillRect(0,0,W,H);

  x.drawImage(blurLayer(y=>{y.globalCompositeOperation='screen';for(let i=0;i<70;i++){const t=r();const px=W*(.1+.8*r())+Math.sin(t*6)*120,py=H*(.05+t*.95);const rr=80+r()*220;const cs=['rgba(60,190,200,','rgba(110,80,220,','rgba(200,90,190,','rgba(40,120,220,','rgba(246,210,140,'];const c=cs[Math.floor(r()*cs.length)];const q=y.createRadialGradient(px,py,0,px,py,rr);q.addColorStop(0,c+(.10+r()*.10)+')');q.addColorStop(1,c+'0)');y.fillStyle=q;y.fillRect(0,0,W,H)}},24),0,0);
  // vía láctea diagonal
  x.drawImage(blurLayer(y=>{y.translate(W/2,H*.55);y.rotate(-.9);const q=y.createLinearGradient(0,-170,0,170);q.addColorStop(0,'rgba(180,200,255,0)');q.addColorStop(.5,'rgba(200,215,255,.20)');q.addColorStop(1,'rgba(180,200,255,0)');y.fillStyle=q;y.fillRect(-H,-170,2*H,340)},20),0,0);
  sparkleField(x,r,900,['rgba(255,255,255,A)','rgba(200,220,255,A)','rgba(246,220,148,A)']);
  // luna creciente dorada
  const mx=W*.5,my=300,mr=150;glowDot(x,mx,my,520,'rgba(246,220,148,A)',.35);glowDot(x,mx,my,260,'rgba(255,240,200,A)',.45);
  const mc=document.createElement('canvas');mc.width=mc.height=mr*2+20;const m=mc.getContext('2d');m.translate(mr+10,mr+10);m.fillStyle=gg(m,-mr,-mr,mr,mr,['#fff3c8','#f6dc94','#d6ae5a','#b8913f']);m.beginPath();m.arc(0,0,mr,0,7);m.fill();
  m.globalAlpha=.18;m.fillStyle='#8a6424';[[-40,-30,26],[30,40,18],[-10,70,12],[50,-60,14]].forEach(([a,b,c])=>{m.beginPath();m.arc(a,b,c,0,7);m.fill()});m.globalAlpha=1;
  m.globalCompositeOperation='destination-out';m.beginPath();m.arc(mr*.55,-mr*.28,mr*.92,0,7);m.fill();
  x.save();x.translate(mx-mr-10,my-mr-10);x.rotate(0);x.shadowColor='rgba(246,220,148,.9)';x.shadowBlur=40;x.drawImage(mc,0,0);x.restore();
  // estrellas colgando de hilos desde la luna
  [[-120,180,14],[-60,260,10],[40,210,12],[110,150,9]].forEach(([dx,L,s])=>{const sx=mx+dx,sy=my+mr*.55;x.strokeStyle='rgba(246,220,148,.55)';x.lineWidth=1;x.beginPath();x.moveTo(sx,sy-40);x.lineTo(sx,sy+L);x.stroke();glowDot(x,sx,sy+L,40,'rgba(246,220,148,A)',.5);star4(x,sx,sy+L,s/2.2,gg(x,sx-s,sy+L-s,sx+s,sy+L+s),1)});
  // constelaciones
  const cons=[[[110,470],[200,420],[290,490],[250,590],[150,570]],[[820,500],[900,440],[980,520],[920,600]],[[120,1700],[210,1760],[310,1720],[380,1800]],[[700,1780],[790,1720],[870,1800],[960,1740]]];
  cons.forEach(c=>{x.strokeStyle='rgba(246,220,148,.4)';x.lineWidth=1.2;x.beginPath();c.forEach((p,i)=>i?x.lineTo(...p):x.moveTo(...p));x.stroke();c.forEach(p=>{glowDot(x,p[0],p[1],18,'rgba(255,240,200,A)',.7);star4(x,p[0],p[1],2.2,'#fffaf0',1)})});
  // estrellas fugaces
  [[900,760,-1],[200,380,1],[1000,1850,-1]].forEach(([sx,sy,d])=>{const L=320;const q=x.createLinearGradient(sx,sy,sx+d*L*.85,sy-L*.5);q.addColorStop(0,'rgba(255,246,220,.95)');q.addColorStop(1,'rgba(246,220,148,0)');x.strokeStyle=q;x.lineWidth=3;x.lineCap='round';x.beginPath();x.moveTo(sx,sy);x.lineTo(sx+d*L*.85,sy-L*.5);x.stroke();glowDot(x,sx,sy,40,'rgba(255,246,220,A)',.8);star4(x,sx,sy,4,'#fff',1)});

  frame(x,34);[[34,34,1,1],[W-34,34,-1,1],[34,H-34,1,-1],[W-34,H-34,-1,-1]].forEach(([a,b,sx,sy])=>filigreeCorner(x,a+10*sx,b+10*sy,sx,sy,.9));
