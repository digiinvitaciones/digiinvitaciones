<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baby shower IV — DIGI INVITACIONES</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Great+Vibes&family=Montserrat:wght@400;500;600&family=Playfair+Display:wght@500;600&family=Dancing+Script:wght@600&family=Pinyon+Script&family=Cinzel:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--c0:#14110f;--c1:#1d1916;--c2:#272220;--tx:#f3ebe0;--mu:#b5a999;--au:#d9b26a;--au2:#f0d49b;--cu:#c07a55;--ln:#d9b26a55}
*{box-sizing:border-box}
html,body{margin:0;background:var(--c0);color:var(--tx);font-family:Montserrat,system-ui,sans-serif;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--ln)}
.brand{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:18px;letter-spacing:.08em}
.crumb{font-size:11px;letter-spacing:.28em;color:var(--au);font-weight:600}
.seg{display:none;margin:12px 16px 0;border:1px solid var(--ln);border-radius:4px;overflow:hidden}
.seg button{flex:1;background:none;border:0;padding:12px 8px;font-size:11px;font-weight:600;letter-spacing:.22em;color:var(--mu);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--au);color:var(--c0)}
.app{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:28px;max-width:1020px;margin:0 auto;padding:16px}
#panel{min-width:0}
.acc{border:1px solid var(--ln);border-radius:4px;margin-bottom:8px;background:var(--c1)}
.acc>button.head{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px;background:none;border:0;padding:16px;cursor:pointer;text-align:left}
.head .t{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:22px}
.head .n{font-size:11px;letter-spacing:.2em;color:var(--au);font-weight:600}
.head .chev{display:block;width:10px;height:10px;border-right:1.5px solid var(--au);border-bottom:1.5px solid var(--au);transform:rotate(45deg);transition:transform .2s;flex:none;margin-left:8px}
.acc.open .chev{transform:rotate(-135deg)}
.body{display:none;padding:2px 16px 18px}
.acc.open .body{display:block}
.head .r{display:flex;align-items:center;gap:10px}
.mk{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;line-height:1;color:#fff}
.mk.ok{background:#2f9e5f}.mk.no{background:#d24b4b}
.acc.extra{padding:16px;border-style:dashed}
.xh{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.xh .n{font-size:11px;letter-spacing:.2em;color:var(--au);font-weight:600}
.xh .t{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:22px}
.xh .av{margin-left:auto;font-size:10px;letter-spacing:.2em;font-weight:600;color:#7fd6a0;border:1px solid #7fd6a066;border-radius:3px;padding:3px 7px}
label.f{display:block;margin:14px 0 0;font-size:11px;letter-spacing:.2em;color:var(--mu);font-weight:600}
.in{display:block;width:100%;margin-top:6px;padding:12px;background:var(--c0);border:1px solid var(--ln);border-radius:4px;color:var(--tx);font-size:16px}
.in:focus,button:focus-visible{outline:2px solid var(--au2);outline-offset:2px}
textarea.in{min-height:72px;resize:vertical}
.sub{font-size:11px;letter-spacing:.22em;color:var(--au);font-weight:600;margin:18px 0 0}
.opts{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;margin-top:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--c0);border:1px solid var(--ln);border-radius:4px;padding:12px;cursor:pointer}
.opt[aria-pressed="true"]{border-color:var(--au);box-shadow:0 0 0 1px var(--au)}
.opt .nm{font-weight:600;font-size:14px}
.opt .ds{font-size:12px;color:var(--mu);margin-top:2px;line-height:1.4}
.dots{display:flex;flex:none}
.dots i{width:20px;height:20px;border:1px solid #ffffff55;margin-right:-6px;border-radius:50%}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.note{font-size:12px;color:var(--mu);margin:12px 0 0;line-height:1.5}
.link{background:none;border:0;color:var(--au2);text-decoration:underline;cursor:pointer;padding:8px 0;font-size:13px}
.next{display:block;width:100%;margin-top:16px;padding:13px;border:1px solid var(--au);background:none;border-radius:4px;color:var(--au2);font-size:11px;letter-spacing:.2em;font-weight:600;cursor:pointer}
.slot{display:flex;align-items:center;gap:12px;margin-top:10px;padding:10px;border:1px solid var(--ln);border-radius:4px;background:var(--c0)}
.slot .th{width:54px;height:54px;border-radius:4px;flex:none;background:var(--c2) center/cover no-repeat;border:1px solid var(--ln)}
.slot label{flex:1;font-size:12px;color:var(--mu);cursor:pointer;line-height:1.4}
.slot input{display:none}
.slot .pick{display:inline-block;margin-top:4px;color:var(--au2);text-decoration:underline;font-weight:600;font-size:13px}
input[type=range]{width:100%;accent-color:var(--au);margin-top:10px}
.sum{font-size:13px;line-height:1.8;color:var(--mu);margin:8px 0 0}
.sum b{color:var(--tx);font-weight:600}
.price{display:flex;align-items:baseline;gap:10px;margin-top:14px}
.price b{font-family:"Cormorant Garamond",Georgia,serif;font-size:34px;font-weight:600}
.price s{color:var(--mu);font-size:14px}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:12px;line-height:1.5;color:var(--mu);cursor:pointer}
.chk input{margin-top:2px;accent-color:var(--au);width:18px;height:18px;flex:none}
.buy{width:100%;margin-top:14px;padding:16px;border:0;border-radius:4px;background:var(--au);color:var(--c0);font-weight:600;letter-spacing:.14em;font-size:13px;cursor:pointer}
.buy[disabled]{opacity:.4;cursor:not-allowed}
.toast{margin-top:10px;font-size:12px;color:var(--au2);min-height:18px;line-height:1.4}
/* escenario */
#stage{min-width:0;display:flex;flex-direction:column;align-items:center}
.phone{position:sticky;top:12px;width:min(350px,100%);padding:3px;border-radius:34px;background:linear-gradient(135deg,var(--pa,#d9b26a),var(--ps,#f0d49b),var(--pa,#d9b26a),var(--pd,#9c7a1f),var(--pa,#d9b26a));box-shadow:0 0 28px var(--pg,#d9b26a55)}
.phone .in2{padding:8px;border-radius:31px;background:#0c0a09}
.screen{position:relative;height:min(660px,calc(100vh - 110px));min-height:520px;border-radius:24px;overflow:hidden}
.inv{height:100%;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
canvas.fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cap{font-size:11px;letter-spacing:.2em;color:var(--mu);margin:12px 0 0;text-align:center}
.replay{margin-top:8px;background:none;border:1px solid var(--ln);color:var(--au2);padding:10px 16px;border-radius:4px;font-size:11px;letter-spacing:.2em;font-weight:600;cursor:pointer}
/* ===== invitación ===== */
.inv{background:var(--bg1);color:var(--ink);font-family:Montserrat,system-ui,sans-serif}
.inv *{box-sizing:border-box}
.inv button{cursor:pointer}
.inv .sec{position:relative;padding:48px 24px;text-align:center}
.inv .alt{background:var(--surf)}
.inv .lab{font-size:10px;letter-spacing:.34em;font-weight:600;color:var(--mut);transition:color .8s,text-shadow .8s}
.inv .lit .lab,.inv .lit.lab{color:var(--txt)}
.inv .ser{font-family:var(--serif)}
.inv h3{font-family:var(--serif);font-weight:600;font-size:28px;margin:10px 0 6px;color:var(--ink)}
.inv .p{font-size:13px;line-height:1.7;color:var(--mut)}
.inv .gl{display:block;width:0;height:1px;margin:14px auto 0;background:linear-gradient(90deg,transparent,var(--acc),transparent);transition:width 1.2s ease}
.inv .lit .gl{width:120px}
.inv .cover{position:relative;overflow:hidden;min-height:max(100%,620px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px 30px 56px;gap:12px}
.inv .bgi{position:absolute;inset:0;background:var(--sky) center/cover no-repeat}
.inv .veil{position:absolute;inset:0;background:var(--bg1);opacity:.42}
.inv .bgi svg{position:absolute;inset:0;width:100%;height:100%}
.inv .drift{position:absolute;left:0;width:1520px;pointer-events:none;animation:drift var(--dur,95s) linear infinite;animation-play-state:var(--play,running)}
.inv .drift svg{display:block;width:100%;height:100%}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.inv .hilo{position:absolute;inset:14px;width:calc(100% - 28px);height:calc(100% - 28px);pointer-events:none}
.inv .hilo{filter:drop-shadow(0 0 3px rgba(240,194,112,.9))}
.inv .hilo rect{fill:none;stroke:url(#hG);stroke-width:1.6;vector-effect:non-scaling-stroke;stroke-dasharray:1;stroke-dashoffset:1}
.inv .cover.open .hilo rect{animation:draw 3.6s ease-out .6s forwards}
.inv.still .hilo rect{animation:none;stroke-dashoffset:0}
@keyframes draw{to{stroke-dashoffset:0}}
.inv .cc{position:relative;display:flex;flex-direction:column;align-items:center;gap:12px;max-width:100%;opacity:0;transform:translateY(14px);transition:opacity 1.4s ease .9s,transform 1.4s ease .9s}
.inv .cover.open .cc{opacity:1;transform:none}
.inv.still .cc{transition:none}
.inv .gate{position:absolute;top:-6%;height:112%;width:62%;pointer-events:none;transition:transform 2.6s cubic-bezier(.65,0,.25,1),opacity 2.6s ease}
.inv .gate svg{width:100%;height:100%;display:block;overflow:visible}
.inv .gl1{left:-4%}.inv .gr1{right:-4%}
.inv .cover.open .gl1{transform:translateX(-112%);opacity:0}
.inv .cover.open .gr1{transform:translateX(112%);opacity:0}
.inv.still .gate{transition:none}
.inv .skyv{position:absolute;inset:0;z-index:2;pointer-events:none;transition:opacity .9s ease 2s}
.inv .skyv svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.inv .skyv .fly,.inv .skyv .cl{transition:transform 2.6s cubic-bezier(.5,0,.75,.35)}
.inv .skyv .cl-l{transition-timing-function:cubic-bezier(.4,0,.2,1)}.inv .skyv .cl-r{transition-timing-function:cubic-bezier(.4,0,.2,1)}
.inv .cover.open .skyv{opacity:0}
.inv .cover.open .skyv .fly{transform:translateY(-950px) scale(1.25)}
.inv .cover.open .skyv .cl-l{transform:translateX(-300px)}
.inv .cover.open .skyv .cl-r{transform:translateX(300px)}
.inv.still .skyv,.inv.still .skyv .fly,.inv.still .skyv .cl{transition:none}
.inv .cover.glo .opener{top:68%}
.inv .opener{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;padding:15px 22px;border:1px solid var(--acc);background:var(--bg1);color:var(--txt);font-size:10px;letter-spacing:.3em;font-weight:600;border-radius:2px;animation:pulse 2.4s ease-in-out infinite;transition:opacity .5s}
.inv .cover.open .opener{opacity:0;pointer-events:none;animation:none}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--acc)}50%{box-shadow:0 0 18px 2px var(--soft)}}
.inv .foil{background:var(--foilg,linear-gradient(110deg,var(--deep) 0%,var(--acc) 30%,var(--hi) 50%,var(--acc) 70%,var(--deep) 100%));background-size:250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:shim 5s linear infinite;animation-play-state:var(--play,running)}
.inv .sway{transform-box:view-box;animation:sway 5.5s ease-in-out infinite alternate;animation-play-state:var(--play,running)}
@keyframes sway{from{transform:rotate(calc(var(--amp,2deg) * -1))}to{transform:rotate(var(--amp,2deg))}}
.inv .hal{animation:halo 4.5s ease-in-out infinite;animation-play-state:var(--play,running)}
@keyframes halo{0%,100%{opacity:.6}50%{opacity:1}}
.inv .cc{isolation:isolate}
.inv .cc::before{content:"";position:absolute;left:-34px;right:-34px;top:-30px;bottom:-30px;z-index:-1;background:radial-gradient(closest-side,rgba(255,255,255,.4),rgba(255,255,255,0));animation:halo 5s ease-in-out infinite;animation-play-state:var(--play,running)}
.inv .nmw{position:relative;isolation:isolate}
.inv .nmw::before{content:"";position:absolute;inset:-22% -6%;z-index:-1;background:radial-gradient(closest-side,rgba(255,255,255,.2),rgba(255,255,255,0));animation:halo 4s ease-in-out infinite -1.5s;animation-play-state:var(--play,running)}
.inv .sec h3{position:relative;isolation:isolate}
.inv .sec h3::before{content:"";position:absolute;inset:-18px -26px;z-index:-1;background:radial-gradient(closest-side,var(--glow) 0%,color-mix(in srgb,var(--glow) 55%,transparent) 38%,color-mix(in srgb,var(--glow) 18%,transparent) 68%,transparent 100%);opacity:0;transition:opacity 1.4s}
.inv .lit h3::before{opacity:1}
.inv .quote,.inv .ring,.inv .units,.inv .alias,.inv .sw,.inv .gal{position:relative;isolation:isolate}
.inv .quote::before,.inv .ring::before,.inv .units::before,.inv .alias::before,.inv .sw::before,.inv .gal::before{content:"";position:absolute;inset:-22px -26px;z-index:-1;background:radial-gradient(closest-side,var(--glow) 0%,color-mix(in srgb,var(--glow) 55%,transparent) 38%,color-mix(in srgb,var(--glow) 18%,transparent) 68%,transparent 100%);opacity:0;transition:opacity 1.4s}
.inv .lit .quote::before,.inv .lit .ring::before,.inv .lit .units::before,.inv .lit .alias::before,.inv .lit .sw::before,.inv .lit .gal::before{opacity:1}
.inv .lab{text-shadow:0 0 12px color-mix(in srgb,var(--soft) 0%,transparent)}
.inv .lit .lab{text-shadow:0 0 14px var(--lsh,transparent)}
.inv .tw{transform-box:fill-box;transform-origin:center;animation:tw 2.8s ease-in-out infinite;animation-play-state:var(--play,running)}
@keyframes tw{0%,100%{opacity:.2;transform:scale(.55)}50%{opacity:1;transform:scale(1.2)}}
.inv .pair2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.inv .sub2{margin-top:26px}
.inv .sep{display:block;height:1px;margin:26px auto 0;width:140px;background:linear-gradient(90deg,transparent,#d9a354,transparent)}
.inv .bob{animation:bob 4.2s ease-in-out infinite alternate;animation-play-state:var(--play,running)}
@keyframes bob{from{transform:translateY(calc(var(--bobpx,2px) * -1))}to{transform:translateY(var(--bobpx,2px))}}
.inv .cover.glo .cc{width:54%;gap:9px}
.inv .cover.glo .big{font-size:18px}
.inv .cover.glo .date{font-size:9px;letter-spacing:.16em}
.inv .cover.glo .p{font-size:11px}
.inv .cover.nt .cc::before{background:radial-gradient(closest-side,rgba(255,226,160,.12) 0%,rgba(255,226,160,.05) 55%,rgba(255,226,160,0) 100%)}
.inv .cover.nt .nmw::before{background:radial-gradient(closest-side,rgba(255,226,160,.2) 0%,rgba(255,226,160,.07) 55%,rgba(255,226,160,0) 100%)}
.inv .cover.nt .veil{opacity:0 !important}
.inv .cover.nt .p{color:var(--ink) !important}
@keyframes shim{from{background-position:120% 0}to{background-position:-120% 0}}
.inv .cover .foil{background:var(--cfoil);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 1px 1px rgba(130,85,0,.35))}
.inv .nm{font-style:var(--nmst,normal);display:inline-block;white-space:nowrap;font-family:var(--script);line-height:1.5;padding:.16em .26em}
.inv .big{font-family:var(--serif);font-style:italic;font-size:22px;color:var(--ink)}
.inv .date{font-size:11px;letter-spacing:.24em;font-weight:500;line-height:1.8;color:var(--ink)}
.inv .rule{width:84px;height:2px;background:linear-gradient(90deg,transparent,#efc67e 30%,#fbe8c2 50%,#efc67e 70%,transparent);box-shadow:0 0 10px rgba(240,194,112,.8)}
.inv .quote{font-family:var(--serif);font-style:italic;font-size:23px;line-height:1.4;max-width:270px;margin:0 auto;color:var(--ink)}
.inv .ring{width:236px;height:236px;margin:18px auto 0;position:relative}
.inv .ring svg{position:absolute;inset:0;width:100%;height:100%}
.inv .ring circle{fill:none;stroke:#dcae6c;stroke-width:1}
.inv .ring circle.prog{stroke:url(#rG);stroke-width:3;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;stroke-dasharray:302;stroke-dashoffset:302;transition:stroke-dashoffset 2.6s ease-out}
.inv .ring.go circle.prog{stroke-dashoffset:var(--off)}
.inv .ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.inv .ring b{font-family:var(--serif);font-weight:500;font-size:92px;line-height:1;font-variant-numeric:lining-nums;padding:0 .04em;background:var(--numg);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.inv .ring span{font-size:11px;letter-spacing:.34em;margin-top:8px;color:var(--txt);font-weight:600}
.inv .units{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:22px auto 0;max-width:280px}
.inv .units div{border-top:2px solid #e2b676;box-shadow:0 -6px 10px -8px rgba(240,194,112,.9);padding-top:10px}
.inv .units b{display:block;font-family:var(--serif);font-weight:500;font-size:36px;line-height:1.1;font-variant-numeric:lining-nums tabular-nums;background:var(--numg);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.inv .units span{display:block;font-size:9px;letter-spacing:.3em;margin-top:4px;color:var(--txt);font-weight:600}
.inv .btns{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;margin-top:12px}
.inv .b{display:block;width:100%;padding:14px 10px;border:1px solid #f3d19a;border-radius:2px;font-size:10px;letter-spacing:.2em;font-weight:600;color:#4a2f10;background:linear-gradient(100deg,#f7dcae 0%,#e2b676 45%,#c98f48 100%);box-shadow:0 0 16px rgba(240,194,112,.45);text-align:center}
.inv .b.solid{}
.inv .rv{opacity:0;transform:translateY(26px);transition:opacity .9s ease,transform .9s ease}
.inv .rv.shown{opacity:1;transform:none}
.inv.still .rv{opacity:1;transform:none;transition:none}
.inv .tl{position:relative;max-width:260px;margin:22px auto 0;text-align:left;padding-left:26px}
.inv .tl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--soft)}
.inv .tl div{position:relative;padding:0 0 22px}
.inv .tl div:last-child{padding-bottom:0}
.inv .tl div::before{content:"";position:absolute;left:-26px;top:3px;width:11px;height:11px;border-radius:50%;border:1px solid var(--acc);background:var(--surf);transition:background .8s,box-shadow .8s}
.inv .tl div.lit::before{background:var(--acc);box-shadow:0 0 10px var(--acc)}
.inv .tl b{display:block;font-family:var(--serif);font-size:20px;font-weight:600;color:var(--ink)}
.inv .tl span{font-size:11px;letter-spacing:.2em;color:var(--txt);font-weight:600}
.inv .sw{display:flex;justify-content:center;gap:10px;margin-top:16px}
.inv .sw i{width:34px;height:34px;border-radius:50%;border:1px solid var(--acc)}
.inv .alias{display:inline-block;margin-top:12px;padding:10px 16px;border:1px dashed var(--hi);font-weight:600;letter-spacing:.08em;font-size:14px;word-break:break-all;color:var(--ink)}
.inv .copy{display:block;margin:10px auto 0;background:none;border:0;color:var(--txt);font-size:10px;letter-spacing:.24em;font-weight:600;text-decoration:underline;padding:8px}
.inv .foot{padding:28px 24px 38px;text-align:center;font-size:9px;letter-spacing:.34em;color:var(--mut)}
.inv .foot a{color:var(--txt);text-decoration:none;font-weight:600}
/* galería 3D */
.inv .gal{position:relative;height:300px;margin:20px -8px 0;perspective:900px;touch-action:pan-y}
.inv .fr{position:absolute;left:50%;top:6px;width:170px;height:250px;margin-left:-85px;border:1.5px solid var(--hi);border-radius:3px;background:var(--surf) center/cover no-repeat;overflow:hidden;transition:transform .8s cubic-bezier(.3,.7,.2,1),opacity .8s;box-shadow:0 0 22px var(--soft),0 0 8px var(--hi)}
.inv .fr.c{animation:glow 3s ease-in-out infinite;animation-play-state:var(--play,running)}
@keyframes glow{0%,100%{box-shadow:0 0 14px var(--soft),0 0 6px var(--hi)}50%{box-shadow:0 0 34px var(--hi),0 0 12px var(--soft)}}
.inv .fr svg{width:100%;height:100%;display:block}
.inv .fr em{position:absolute;left:0;right:0;bottom:8px;font-style:normal;font-size:8px;letter-spacing:.3em;color:var(--txt);font-weight:600}
.inv .gdots{display:flex;justify-content:center;gap:8px;margin-top:6px}
.inv .gdots i{width:6px;height:6px;border-radius:50%;background:var(--soft);transition:background .4s,transform .4s}
.inv .gdots i.on{background:var(--acc);transform:scale(1.4)}
/* confirmación */
.inv .rs{text-align:left;margin-top:20px}
.inv .ac{border:1px solid var(--soft);border-radius:2px;margin-bottom:8px;background:var(--bg1)}

function trail(x,y){
  if(reduce||!cv)return;var t=Date.now();if(t-lastT<55)return;lastT=t;var r=cv.getBoundingClientRect();
  P.push({k:"s",x:x-r.left+(Math.random()-.5)*8,y:y-r.top+(Math.random()-.5)*8,vx:(Math.random()-.5)*.7,vy:Math.random()*.5+.15,g:.012,r:Math.random()*2.6+2.4,life:1,dec:.022,col:Math.random()<.6?"#efca85":"#f7f9fc"});
  if(P.length>160)P.splice(0,P.length-160);kick();
}
$("#inv").addEventListener("mousemove",function(e){if(opened)trail(e.clientX,e.clientY)});
$("#inv").addEventListener("touchmove",function(e){var q=e.touches&&e.touches[0];if(q&&opened)trail(q.clientX,q.clientY)},{passive:true});
$("#inv").addEventListener("touchstart",function(e){var q=e.touches&&e.touches[0];if(q&&opened){lastT=0;trail(q.clientX,q.clientY)}},{passive:true});
/* eventos dentro de la invitación */
$("#inv").addEventListener("click",function(e){
  var t=e.target.closest("button");
  if(!e.target.closest("input,textarea,select,label"))burst(e.clientX,e.clientY,(t&&t.id==="open")?30:16);
  if(!t)return;
  if(t.id==="open"){var c=$("#cover");opened=true;c.classList.add("open");return}
  if(t.id==="rain"){rain();return}
  if(t.id==="copy"){try{navigator.clipboard.writeText(S.alias).then(function(){t.textContent="COPIADO"},function(){t.textContent=S.alias})}catch(x){t.textContent=S.alias}return}
  if(t.hasAttribute("data-tg")){var a=t.parentElement,was=a.classList.contains("open");document.querySelectorAll("#rs .ac").forEach(function(x){x.classList.remove("open")});if(!was)a.classList.add("open");return}
  if(t.hasAttribute("data-asi")){var yes=t.getAttribute("data-asi")==="1";rsvpOn=yes;t.parentElement.querySelectorAll("button").forEach(function(b){b.classList.toggle("on",b===t)});$("#ac2").classList.toggle("off",!yes);$("#ac3").classList.toggle("off",!yes);return}
  if(t.id==="send"){var n=$("#r_n").value.trim();
    if(!n){$("#okbox").innerHTML='<div class="ok">Falta tu nombre. Abrí “Tus datos” y completalo.</div>';return}
    if(!$("#r_ok").checked){$("#okbox").innerHTML='<div class="ok">Falta aceptar el uso de tus datos en “Canción y mensaje”.</div>';return}
    var code="BS-"+Math.random().toString(36).slice(2,7).toUpperCase();
    $("#okbox").innerHTML='<div class="ok">¡Gracias, '+esc(n)+'!<br>'+(rsvpOn?'Te esperamos.':'Lamentamos que no puedas venir.')+'<b>'+code+'</b>Guardá este código como comprobante.</div>';
  }
});
$("#inv").addEventListener("input",function(e){if(e.target.id==="r_a"||e.target.id==="r_m")comp()});

renderPanel();renderInv();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){fit()});
